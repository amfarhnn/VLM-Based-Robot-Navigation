services:
  laptop-expected-results:
    image: vlm-robot-laptop-demo:latest
    build:
      context: ./src/laptop_expected_results
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    init: true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
